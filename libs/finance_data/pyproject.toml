[project]
name = "finance-data"
version = "0.1.0"
description = "Unified library for finance data access using FinanceDataReader"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "finance-datareader>=0.9.96",
    "pandas>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
